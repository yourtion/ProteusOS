goal: 对变更清单生成可验证的文件分类摘要（新能力验收）
inputs: ["../inputs/changed-files.json"]
constraints:
  budget:
    maxAttempts: 3
    maxWallClockSeconds: 60
  # 缺口等待截止 1 秒：R1/R3 的等待可在测试中推进结案
  missingCapabilityWaitSeconds: 1
requires: ["changed-file-summary"]
acceptance:
  outputSchema: ../schemas/changed-file-summary.schema.json
  expectedOutput: ../evals/summary-output.json
  verifier: stats-acceptance
